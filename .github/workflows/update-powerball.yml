name: 🎱 Weekly Powerball Data Update

on:
  schedule:
    # Draws are Thursday night, Sydney time. Times below are UTC, and GitHub
    # often starts scheduled runs hours late. A run does nothing if the page
    # already has the latest draw, so the Friday retries are cheap.
    - cron: '0 13 * * 4'   # Friday ~midnight Sydney
    - cron: '0 1 * * 5'    # Friday ~noon Sydney (retry)
    - cron: '0 7 * * 5'    # Friday ~evening Sydney (last try; fails and emails if still missing)
  workflow_dispatch:
    # Allow manual trigger anytime

permissions:
  contents: write

jobs:
  update-powerball:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: 🔄 Fetch latest Powerball results & update HTML
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * 5" ]; then
            # Last Friday try: by now the page must have this week's draw.
            python .github/scripts/update_powerball.py --stale-days 7
          else
            python .github/scripts/update_powerball.py
          fi

      - name: 📝 Commit & push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add powerball-au.html powerball-au-classic.html
          if git diff --staged --quiet; then
            echo "✅ No new draw data — file unchanged."
          else
            DRAW=$(grep -oP '\{draw:\K\d+' powerball-au.html | head -1)
            DATE=$(date +'%d %b %Y')
            git commit -m "📊 Auto-update: Draw #${DRAW} (${DATE})"
            git push
            echo "🚀 Pushed update for Draw #${DRAW}"
          fi
